<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talker 智能客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f4f8; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: #fff; padding: 14px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    display: flex; align-items: center; gap: 10px;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #4f7cff, #7b5cff);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: 16px;
  }
  header h1 { font-size: 17px; font-weight: 600; color: #222; }
  header span { font-size: 12px; color: #999; }

  #chat { flex: 1; overflow-y: auto; padding: 24px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { display: flex; margin-bottom: 18px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 11px 15px; border-radius: 14px; font-size: 15px;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #4f7cff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .msg.bot .bubble .sources {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e3e6ee;
    font-size: 12px; color: #8a93a5;
  }
  .msg.bot .bubble .sources a { color: #4f7cff; text-decoration: none; cursor: pointer; }

  #input-bar {
    background: #fff; border-top: 1px solid #e7eaf0; padding: 12px 24px;
    display: flex; gap: 10px; align-items: flex-end; max-width: 760px; width: 100%;
    margin: 0 auto 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  #input {
    flex: 1; border: none; outline: none; resize: none; font-size: 15px;
    line-height: 1.5; font-family: inherit; max-height: 120px; padding: 6px 2px;
  }
  #send {
    background: #4f7cff; color: #fff; border: none; border-radius: 10px;
    padding: 9px 20px; font-size: 15px; cursor: pointer; flex-shrink: 0;
  }
  #send:disabled { background: #b9c6f5; cursor: not-allowed; }

  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: #b6bcc9;
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
</style>
</head>
<body>
<header>
  <div class="logo">T</div>
  <h1>Talker 智能客服</h1>
  <span>基于产品知识库的 AI 助手</span>
</header>

<div id="chat">
  <div class="msg bot"><div class="bubble">您好，我是 Talker 智能客服 🤖<br>关于产品规格、价格、功能、售后政策的问题都可以问我～</div></div>
</div>

<div id="input-bar">
  <textarea id="input" rows="1" placeholder="输入你的问题，回车发送"></textarea>
  <button id="send">发送</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const history = [];   // [{role, content}]，随每次请求带上，实现多轮对话

function addMsg(role, text, sources) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'sources';
    s.textContent = '参考来源：' + sources.map(x => x.source + ' (片段' + x.chunk_idx + ')').join('，');
    bubble.appendChild(s);
  }
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = '<div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function ask(question) {
  history.push({ role: 'user', content: question });
  const typing = showTyping();
  sendBtn.disabled = true;
  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history }),
    });
    const data = await resp.json();
    typing.remove();
    if (!resp.ok) throw new Error(data.detail || '服务出错了');
    addMsg('bot', data.answer, data.sources);
    history.push({ role: 'assistant', content: data.answer });
  } catch (e) {
    typing.remove();
    addMsg('bot', '抱歉，出错了：' + e.message);
    history.pop();   // 失败的问题不放进历史
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.onclick = () => {
  const q = input.value.trim();
  if (!q) return;
  addMsg('user', q);
  input.value = '';
  input.style.height = 'auto';
  ask(q);
};

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
